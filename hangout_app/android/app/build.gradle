plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.hangout"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.example.hangout"
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // TODO: configure your own signing config before releasing.
            signingConfig = signingConfigs.debug

            // Shrink + obfuscate Dart-side is handled by Flutter (AOT);
            // this shrinks the Java/Kotlin side and strips unused resources.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Agora ships many OPTIONAL native extensions inside its AAR. We only use
    // AI noise suppression + clear vision (video filters), so drop the rest.
    // Each excluded lib saves ~1-8 MB per CPU architecture.
    packagingOptions {
        jniLibs {
            excludes += [
                "**/libagora_screen_capture_extension.so",
                "**/libagora_spatial_audio_extension.so",
                "**/libagora_content_inspect_extension.so",
                "**/libagora_face_detection_extension.so",
                "**/libagora_face_capture_extension.so",
                "**/libagora_video_quality_analyzer_extension.so",
                "**/libagora_audio_beat_detection_extension.so",
                "**/libagora_super_resolution_extension.so",
                "**/libagora_lip_sync_extension.so",
                "**/libagora_udrm3_extension.so",
                "**/libagora_drm_loader_extension.so",
                "**/libagora_video_av1_encoder_extension.so",   // AV1 codec (big)
                "**/libagora_video_av1_decoder_extension.so",
            ]
        }
    }
}

flutter {
    source = "../.."
}

// Firebase — requires android/app/google-services.json (see README).
apply plugin: "com.google.gms.google-services"
