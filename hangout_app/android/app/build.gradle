plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.hangout"
    compileSdk = 35
    // Match the NDK required by the plugins (agora/firebase/etc. all ask for
    // 25.1.8937393; NDK is backward compatible so use the highest).
    ndkVersion = "25.1.8937393"

    compileOptions {
        // Required by flutter_local_notifications: scheduled notifications
        // use java.time APIs that need core library desugaring on older
        // Android versions.
        coreLibraryDesugaringEnabled = true
        // Java 17, because record_android compiles at 17 and Gradle refuses
        // to link modules with inconsistent JVM targets. Desugaring keeps
        // minSdk 24 working. CI already runs JDK 17.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.hangout"
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // TODO: configure your own signing config before releasing.
            signingConfig = signingConfigs.debug

            // Shrink + obfuscate Dart-side is handled by Flutter (AOT);
            // this shrinks the Java/Kotlin side and strips unused resources.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Agora ships many OPTIONAL native extensions inside its AAR. We only use
    // AI noise suppression + clear vision (video filters), so drop the rest.
    // Each excluded lib saves ~1-8 MB per CPU architecture.
    packagingOptions {
        jniLibs {
            // Compress native libraries in the APK. AGP 8 defaults this to
            // false (uncompressed .so, required for Play's App Bundles), which
            // is a poor trade for a directly-distributed APK: this app ships a
            // lot of Agora native code, so compression cuts the download size
            // substantially. Only revisit if switching to .aab delivery.
            useLegacyPackaging = true

            // Agora optional extensions the app never calls. Each entry saves
            // roughly 0.5-4 MB *per ABI*. Sizes below are arm64-v8a from
            // https://docs.agora.io/en/help/integration-issues/reduce_app_size_rtc
            excludes += [
                "**/libagora_screen_capture_extension.so",
                "**/libagora_spatial_audio_extension.so",       // 3.8 MB
                "**/libagora_content_inspect_extension.so",
                "**/libagora_face_detection_extension.so",
                "**/libagora_face_capture_extension.so",
                "**/libagora_video_quality_analyzer_extension.so",
                "**/libagora_audio_beat_detection_extension.so",
                "**/libagora_super_resolution_extension.so",    // 0.8 MB
                "**/libagora_lip_sync_extension.so",
                "**/libagora_udrm3_extension.so",
                "**/libagora_drm_loader_extension.so",

                // AV1. The previous "libagora_video_av1_{encoder,decoder}"
                // entries matched nothing — Agora ships the decoder as dav1d.
                "**/libagora_dav1d_extension.so",               // 0.7 MB
                "**/libagora_av1_encoder_extension.so",

                // Beauty filter + background blur were removed from the call
                // UI, so their extensions can go too. Re-adding either feature
                // means deleting the matching line here.
                "**/libagora_segmentation_extension.so",        // 3.3 MB blur
                "**/libagora_video_process_extension.so",       // 1.3 MB beauty
                "**/libagora_clear_vision_extension.so",        // 2.1 MB

                // Playback of arbitrary audio files via the RTC engine is
                // unused; voice notes are played by audioplayers instead.
                "**/libagora_full_audio_format_extension.so",   // 4.4 MB

                // Beta extras that are never enabled.
                "**/libagora_jnd_extension.so",                 // 1.2 MB
                "**/libagora_fd_extension.so",                  // 1.6 MB
                "**/libagora_audio_beauty_extension.so",        // voice presets

                // NOTE: the AI noise-suppression and AI echo-cancellation
                // extensions are deliberately NOT excluded. setNoiseSuppression()
                // turns on che.audio.{ns,aec,agc}, and they are only ~200 KB per
                // ABI — not worth risking call audio quality to save.
            ]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Core library desugaring for flutter_local_notifications.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// Firebase — requires android/app/google-services.json (see README).
apply plugin: "com.google.gms.google-services"
