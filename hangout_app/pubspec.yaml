name: hangout
description: "Hangout — a modern messaging + voice/video calling app (Android) with AI noise suppression and video filters."
publish_to: "none"
version: 1.0.0+1

environment:
  # flutter_foreground_task 10.x needs Dart 3.4+ (Flutter 3.22+).
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase — auth + chat (Firestore) only. Push is FCM-free:
  # the app keeps a WebSocket to the Cloudflare Worker and raises
  # notifications itself (see services/push_service.dart).
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # FCM-free push: WebSocket signaling + local notifications +
  # foreground service that keeps the socket alive in the background.
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^18.0.1
  flutter_foreground_task: ^10.0.0

  # Agora — audio/video calls + AI noise suppression + video filters
  agora_rtc_engine: ^6.6.3

  # Utilities
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

  # Vector icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
