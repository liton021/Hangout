name: hangout
description: "Hangout — a modern messaging + voice/video calling app (Android) with AI noise suppression and video filters."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase — auth, chat (Firestore), push (FCM)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Agora — audio/video calls + AI noise suppression + video filters
  agora_rtc_engine: ^6.6.3

  # Utilities
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  http: ^1.1.0

  # Push notifications — native incoming call UI + local notifications
  flutter_callkit_incoming: ^3.1.5
  flutter_local_notifications: ^17.0.0

  # Vector icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
