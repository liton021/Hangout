name: hangout
description: "Hangout — a modern messaging + voice/video calling app (Android) with AI noise suppression and video filters."
publish_to: "none"
version: 1.0.0+1

environment:
  # flutter_foreground_task 9.x needs Dart 3.4+ (Flutter 3.22+); matches the
  # CI's Flutter 3.24.0.
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase — auth + chat (Firestore) only. Push is FCM-free:
  # the app keeps a WebSocket to the Cloudflare Worker and raises
  # notifications itself (see services/push_service.dart).
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # FCM-free push: WebSocket signaling + local notifications +
  # foreground service that keeps the socket alive in the background.
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^18.0.1
  # 9.2.2 is the newest release that still supports the CI's Flutter 3.24.0
  # (10.x requires Flutter >=3.38.0). Do not bump past 9.x without also
  # updating the Flutter version in .github/workflows/build.yml.
  flutter_foreground_task: ^9.2.2

  # Agora — audio/video calls + AI noise suppression + video filters.
  # NOTE: 6.6.2+ depends on ffi ^1.1.2, which conflicts with
  # flutter_local_notifications' Linux impl (ffi ^2.0.1) and breaks
  # dependency resolution. 6.5.4 is the newest stable (published May 2026,
  # after 6.6.3), uses ffi 2.x, and keeps the same 6.x API.
  agora_rtc_engine: ^6.5.4

  # Profile pictures: pick from gallery/camera, then crop + compress in-app
  # before uploading to the Cloudflare Worker (see services/avatar_service.dart).
  # 1.1.2 is the newest image_picker that still builds on the CI's Flutter
  # 3.24.0 / Dart 3.5 (1.2.x requires Dart 3.6+). Bump only together with the
  # Flutter version in .github/workflows/build.yml.
  image_picker: ^1.1.2
  # 4.5.x is the last line supporting Dart 3.0+; used for the square crop
  # and JPEG re-encode so uploads stay ~60 KB.
  image: ^4.5.4

  # Voice notes: record mono AAC and play it back.
  #
  # record is pinned to 5.2.1, NOT 6.x. record 6.x pulls record_android >= 1.4.1,
  # whose android/build.gradle declares `compileSdk = flutter.compileSdkVersion`.
  # Flutter 3.24.0 only creates the `flutter` extension on the *app* project, so
  # plugin subprojects fail to evaluate with:
  #   Could not get unknown property 'flutter' for extension 'android'
  #   compileSdkVersion is not specified. Please add it to build.gradle
  # record_android 1.3.3 is the newest release that hardcodes `compileSdk = 34`,
  # and record 5.2.1 is the matching frontend. The AudioRecorder/RecordConfig API
  # the app uses (start/stop/cancel/hasPermission/isRecording/onAmplitudeChanged,
  # aacLc, autoGain, echoCancel, noiseSuppress) is identical in 5.2.1.
  # Revisit only when CI moves to Flutter >= 3.27, which injects `flutter` into
  # plugin subprojects.
  #
  # audioplayers 6.4.0 is the newest that still supports Dart 3.5 (6.5+ needs 3.6).
  # Bump either only together with the Flutter version in
  # .github/workflows/build.yml.
  record: 5.2.1
  audioplayers: ^6.4.0
  # Somewhere to write the recording before upload.
  path_provider: ^2.1.4

  # Utilities
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

  # Vector icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# record 5.2.1 asks for record_android: ^1.3.1, which would still resolve to
# 1.5.2 — and every record_android >= 1.4.1 (plus 1.3.2) breaks the Gradle
# build on Flutter 3.24.0 by reading `flutter.compileSdkVersion` from a plugin
# subproject, where the `flutter` extension does not exist. 1.3.3 is the last
# release that hardcodes `compileSdk = 34`, so pin it exactly.
dependency_overrides:
  record_android: 1.3.3

flutter:
  uses-material-design: true
