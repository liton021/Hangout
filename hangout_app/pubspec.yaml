name: hangout_app
description: A Flutter person-to-person chat, audio call, and video call application using Agora.io and Firebase.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0

  # Agora RTC Engine for audio/video calls
  agora_rtc_engine: ^6.5.0

  # Permissions
  permission_handler: ^11.3.1

  # State management
  provider: ^6.1.0

  # UI utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
