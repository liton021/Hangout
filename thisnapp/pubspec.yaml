name: thisnapp
description: A free Flutter app for chat, audio calls, and video calls with noise filtering.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # WebRTC
  flutter_webrtc: ^0.9.48

  # UI & Utils
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  provider: ^6.1.1
  flutter_local_notifications: ^16.3.0
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
